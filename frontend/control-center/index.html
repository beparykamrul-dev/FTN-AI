<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTN Control Center</title><style>body{font-family:system-ui;margin:0;background:#0b1220;color:#e8eef8}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:24px}.card{background:#121c2e;border:1px solid #263650;border-radius:14px;padding:18px}.muted{color:#9db0ca}.ok{color:#65d69b}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}</style></head><body><main><header><div><h1>FTN Control Center</h1><div class="muted">Service-aware Web Control Plane</div></div><button onclick="load()">Refresh</button></header><section id="services"><div class="card">Loading services…</div></section></main><script>async function load(){const root=document.getElementById('services');try{const r=await fetch('/api/v1/services');const d=await r.json();root.innerHTML=d.services.map(s=>`<article class="card"><h2>${s.name}</h2><p class="ok">${s.status}</p><p class="muted">${s.platform.join(' · ')}</p></article>`).join('')}catch(e){root.innerHTML='<div class="card">Control API unavailable</div>'}}load()</script></body></html>
