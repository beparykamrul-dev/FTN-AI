<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTN Control Center</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#08111f;color:#edf4ff}main{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.muted{color:#9fb2ca}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:24px}.card{background:#101c2e;border:1px solid #263953;border-radius:16px;padding:18px}.ok{color:#5de2a0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#1a2b44;margin:3px;font-size:12px}.locked{opacity:.45}button{background:#eaf2ff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.links a{color:#cfe2ff;background:#14243b;padding:9px 12px;border-radius:9px;text-decoration:none}</style></head><body><main><header><div><h1>FTN Control Center</h1><div class="muted">Unified service-aware control plane</div></div><button onclick="load()">Refresh</button></header><div class="links"><a href="/user-portal/">User Portal</a><a href="/app-builder/">Web + Android Builder</a></div><section class="grid" id="services"><div class="card">Loading…</div></section></main><script>const selected=new Set((localStorage.getItem('ftn-services')||'internet,ai,drive').split(',').filter(Boolean));async function load(){const root=document.getElementById('services');try{const d=await (await fetch('/api/v1/services')).json();root.innerHTML=d.services.map(s=>{const active=selected.has(s.id);return '<article class="card '+(active?'':'locked')+'"><h2>'+s.name+'</h2><div class="'+(active?'ok':'muted')+'">'+(active?'Active entitlement':'Not entitled')+'</div><p>'+s.platforms.map(p=>'<span class="pill">'+p+'</span>').join('')+'</p></article>'}).join('')}catch(e){root.innerHTML='<article class="card">Control API unavailable</article>'}}load()</script></body></html>
