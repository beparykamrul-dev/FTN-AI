<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTN User Portal</title><style>body{margin:0;font-family:system-ui;background:#07111f;color:#edf4ff}main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#101c2e;border:1px solid #263953;border-radius:16px;padding:18px}.muted{color:#9fb2ca}.ok{color:#5de2a0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{padding:8px 12px;border-radius:999px;background:#1a2b44}button{padding:10px 14px;border:0;border-radius:10px;font-weight:700}</style></head>
<body><main><header><h1>FTN User Portal</h1><div class="muted">Service-aware customer control</div></header><nav class="nav" id="nav"></nav><section class="grid" id="cards"></section></main><script>const services=[['internet','Internet','Network'],['vpn','VPN / Mesh','Connectivity'],['ddns','DDNS + KPI','ftndns.net'],['hosting','Hosting','Cloud'],['drive','FTN Drive','Storage'],['tv','TV / Media','Player'],['cctv','CCTV Cloud','Security'],['billing','Billing & Payment','Account'],['ai','AI Assistant','FTN AI'],['apps','FTN App Store','Apps']];const entitled=new Set((localStorage.getItem('ftn-services')||'internet,ai,drive').split(','));const nav=document.getElementById('nav'),cards=document.getElementById('cards');services.forEach(([id,name,desc])=>{if(entitled.has(id)){nav.innerHTML+=`<span class="pill">${name}</span>`;cards.innerHTML+=`<article class="card"><h2>${name}</h2><div class="ok">Active</div><p class="muted">${desc}</p><button>Open service</button></article>`}});if(!cards.innerHTML)cards.innerHTML='<article class="card">No active services</article>';</script></body></html>
