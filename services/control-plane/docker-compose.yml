services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ftn
      POSTGRES_USER: ftn
      POSTGRES_PASSWORD: ${FTN_DB_PASSWORD:?set FTN_DB_PASSWORD}
    volumes:
      - ftn-postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftn -d ftn"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: ../..
      dockerfile: services/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      FTN_CONTROL_PLANE_ADDR: ":8080"
      DATABASE_URL: postgres://ftn:${FTN_DB_PASSWORD}@postgres:5432/ftn?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ftn-postgres:
