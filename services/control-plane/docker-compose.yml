x-ftn-production-stack: true

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ftn
      POSTGRES_USER: ftn
      POSTGRES_PASSWORD: ${FTN_DB_PASSWORD:?set FTN_DB_PASSWORD}
    volumes:
      - ftn-postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./migrations/002_platform_foundation.sql:/docker-entrypoint-initdb.d/002-platform-foundation.sql:ro
      - ./migrations/003_durable_execution.sql:/docker-entrypoint-initdb.d/003-durable-execution.sql:ro
      - ./migrations/004_approval_execution.sql:/docker-entrypoint-initdb.d/004-approval-execution.sql:ro
      - ./migrations/005_job_integrity_leases.sql:/docker-entrypoint-initdb.d/005-job-integrity-leases.sql:ro
      - ./migrations/006_job_event_automation.sql:/docker-entrypoint-initdb.d/006-event-automation.sql:ro
      - ./migrations/007_qkd_security.sql:/docker-entrypoint-initdb.d/007-qkd-security.sql:ro
      - ./migrations/008_data_governor.sql:/docker-entrypoint-initdb.d/008-data-governor.sql:ro
      - ./migrations/009_data_governance_controls.sql:/docker-entrypoint-initdb.d/009-data-governance-controls.sql:ro
      - ./migrations/010_dns_guard_filtering.sql:/docker-entrypoint-initdb.d/010-dns-guard-filtering.sql:ro
      - ./migrations/011_migration_registry.sql:/docker-entrypoint-initdb.d/011-migration-registry.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftn -d ftn"]
      interval: 5s
      timeout: 3s
      retries: 10

  migration-runner:
    image: postgres:17
    restart: "no"
    environment:
      DATABASE_URL: postgres://ftn:${FTN_DB_PASSWORD}@postgres:5432/ftn?sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/usr/local/bin/ftn-migrate.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: ["bash /usr/local/bin/ftn-migrate.sh"]

  control-plane:
    build:
      context: ../..
      dockerfile: services/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      FTN_CONTROL_ADDR: ":8080"
      FTN_HEALTH_URL: "http://127.0.0.1:8080/healthz"
      FTN_API_AUTH_TOKEN: "${FTN_API_AUTH_TOKEN:-}"
      FTN_FLOW_LISTEN_ADDR: "${FTN_FLOW_LISTEN_ADDR:-}"
      FTN_FLOW_EXPORTERS: "${FTN_FLOW_EXPORTERS:-}"
      FTN_TRAFFIC_PROBE_TARGETS: "${FTN_TRAFFIC_PROBE_TARGETS:-}"
      FTN_TRAFFIC_PROBE_INTERVAL: "${FTN_TRAFFIC_PROBE_INTERVAL:-15s}"
      FTN_TRAFFIC_PROBE_TIMEOUT: "${FTN_TRAFFIC_PROBE_TIMEOUT:-2s}"
      FTN_CLICKHOUSE_URL: "${FTN_CLICKHOUSE_URL:-}"
      FTN_CLICKHOUSE_DATABASE: "${FTN_CLICKHOUSE_DATABASE:-ftn_analytics}"
      FTN_CLICKHOUSE_USER: "${FTN_CLICKHOUSE_USER:-ftn}"
      FTN_CLICKHOUSE_PASSWORD: "${FTN_CLICKHOUSE_PASSWORD:-}"
      DATABASE_URL: postgres://ftn:${FTN_DB_PASSWORD}@postgres:5432/ftn?sslmode=disable
    ports:
      - "8080:8080"
      - "${FTN_FLOW_PORT:-2055}:2055/udp"
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/ftn-control-plane", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - ftn-control-plane

volumes:
  ftn-postgres:

networks:
  ftn-control-plane:
    name: ftn-control-plane
