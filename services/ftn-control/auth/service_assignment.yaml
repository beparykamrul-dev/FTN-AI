version: 1
assignment:
  required_fields:
    - user_id
    - service_id
    - status
  statuses:
    - pending
    - active
    - suspended
    - revoked
  authorization_rule: active_assignment_only

provisioning_actions:
  - create_identity
  - assign_service
  - provision_mailbox
  - revoke_service

mailbox_policy:
  service_id: mail
  domain: familytimenet.com
  provisioning_source: ftn-control-panel
  public_signup: false
