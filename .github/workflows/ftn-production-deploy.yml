name: FTN Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftn-production-deploy
  cancel-in-progress: false

env:
  FTN_RELEASE_ROOT: /opt/ftn-ai

jobs:
  deploy:
    name: Deploy FTN production release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release contract
        run: |
          set -euo pipefail
          test -x deploy/one-click/live.sh
          test -x deploy/one-click/bootstrap.sh
          test -x scripts/preflight.sh
          test -x scripts/validate-repo.sh
          test -x scripts/validate-production-storage.sh
          test -x scripts/validate-production-ports.sh
          test -x scripts/validate-host-port-ownership.sh
          test -x scripts/validate-production-health.sh
          test -x scripts/validate-db-restore.sh
          test -x deploy/one-click/rollback.sh
          test -x deploy/one-click/release-compatibility.sh
          test -x scripts/production-compose-env.sh
          test -f services/control-plane/docker-compose.yml
          test -f services/control-plane/schema.sql
          test -f services/control-plane/scripts/validate_migrations.sh
          test -f services/control-plane/tests/sql/024_execution_integrity_state_machine.sql
          grep -q '^x-ftn-production-stack: true$' services/control-plane/docker-compose.yml

      - name: Shell syntax validation
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(find deploy scripts services/control-plane/scripts -type f -name '*.sh' -print0 | sort -z)
          test "${#shell_files[@]}" -gt 0
          for file in "${shell_files[@]}"; do
            echo "bash -n $file"
            bash -n "$file"
          done

      - name: Repository validation
        run: bash scripts/validate-repo.sh

      - name: Validate production database restore path
        run: bash scripts/validate-db-restore.sh

      - name: Validate production Compose manifests and host ports
        env:
          FTN_DB_PASSWORD: ci-only-password
          FTN_API_AUTH_TOKEN: ci-only-token
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: ci-only-opensearch-password
          KOPIA_PASSWORD: ci-only-kopia-password
          KOPIA_SERVER_USERNAME: ci-only-kopia-user
          KOPIA_SERVER_PASSWORD: ci-only-kopia-server-password
        run: |
          set -euo pipefail
          ci_env="$RUNNER_TEMP/ftn-compose.env"
          umask 077
          {
            printf 'FTN_DB_PASSWORD=%s\n' "$FTN_DB_PASSWORD"
            printf 'FTN_API_AUTH_TOKEN=%s\n' "$FTN_API_AUTH_TOKEN"
            printf 'OPENSEARCH_INITIAL_ADMIN_PASSWORD=%s\n' "$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
            printf 'KOPIA_PASSWORD=%s\n' "$KOPIA_PASSWORD"
            printf 'KOPIA_SERVER_USERNAME=%s\n' "$KOPIA_SERVER_USERNAME"
            printf 'KOPIA_SERVER_PASSWORD=%s\n' "$KOPIA_SERVER_PASSWORD"
          } > "$ci_env"
          mapfile -t manifests < <(find . -type f \( -name 'docker-compose.yml' -o -name 'compose.yml' \) \
            -not -path './.git/*' -not -path '*/node_modules/*' -print0 | \
            xargs -0 -r grep -El 'FTN_PRODUCTION_STACK=true|x-ftn-production-stack:[[:space:]]*true' | sort)
          test "${#manifests[@]}" -gt 0
          for compose in "${manifests[@]}"; do
            echo "Validating $compose"
            docker compose --env-file "$ci_env" -f "$compose" config --quiet
          done
          ENV_FILE="$ci_env" bash scripts/validate-production-ports.sh
          ENV_FILE="$ci_env" bash scripts/validate-host-port-ownership.sh

      - name: Configure SSH
        env:
          FTN_DEPLOY_SSH_KEY: ${{ secrets.FTN_DEPLOY_SSH_KEY }}
          FTN_PRODUCTION_HOST: ${{ secrets.FTN_PRODUCTION_HOST }}
          FTN_PRODUCTION_PORT: ${{ secrets.FTN_PRODUCTION_PORT }}
        run: |
          set -euo pipefail
          test -n "$FTN_DEPLOY_SSH_KEY"
          test -n "$FTN_PRODUCTION_HOST"
          port="${FTN_PRODUCTION_PORT:-22}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$FTN_DEPLOY_SSH_KEY" > ~/.ssh/ftn_deploy_key
          ssh-keygen -y -f ~/.ssh/ftn_deploy_key >/dev/null
          ssh-keyscan -p "$port" -H "$FTN_PRODUCTION_HOST" >> ~/.ssh/known_hosts
          echo "FTN_SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Package release
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github --exclude='*.log' \
            -czf ftn-ai-release.tar.gz \
            deploy scripts configs services frontend

      - name: Upload release
        env:
          FTN_PRODUCTION_HOST: ${{ secrets.FTN_PRODUCTION_HOST }}
          FTN_PRODUCTION_USER: ${{ secrets.FTN_PRODUCTION_USER }}
        run: |
          set -euo pipefail
          test -n "$FTN_PRODUCTION_USER"
          ssh -i ~/.ssh/ftn_deploy_key -p "$FTN_SSH_PORT" -o BatchMode=yes \
            "$FTN_PRODUCTION_USER@$FTN_PRODUCTION_HOST" \
            "mkdir -p '$FTN_RELEASE_ROOT/releases'"
          scp -i ~/.ssh/ftn_deploy_key -P "$FTN_SSH_PORT" -o BatchMode=yes \
            ftn-ai-release.tar.gz \
            "$FTN_PRODUCTION_USER@$FTN_PRODUCTION_HOST:$FTN_RELEASE_ROOT/releases/ftn-ai-${GITHUB_SHA}.tar.gz"

      - name: Activate through canonical one-click runner
        id: activate
        env:
          FTN_PRODUCTION_HOST: ${{ secrets.FTN_PRODUCTION_HOST }}
          FTN_PRODUCTION_USER: ${{ secrets.FTN_PRODUCTION_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ftn_deploy_key -p "$FTN_SSH_PORT" -o BatchMode=yes \
            "$FTN_PRODUCTION_USER@$FTN_PRODUCTION_HOST" \
            "set -euo pipefail; test -f '$FTN_RELEASE_ROOT/.env'; mkdir -p '$FTN_RELEASE_ROOT/releases/${GITHUB_SHA}'; tar -xzf '$FTN_RELEASE_ROOT/releases/ftn-ai-${GITHUB_SHA}.tar.gz' -C '$FTN_RELEASE_ROOT/releases/${GITHUB_SHA}'; ln -sfn '$FTN_RELEASE_ROOT/.env' '$FTN_RELEASE_ROOT/releases/${GITHUB_SHA}/.env'; ln -sfn '$FTN_RELEASE_ROOT/releases/${GITHUB_SHA}' '$FTN_RELEASE_ROOT/current'; cd '$FTN_RELEASE_ROOT/current'; sudo -n bash deploy/one-click/live.sh"

      - name: Production health check
        id: health
        env:
          FTN_PRODUCTION_HOST: ${{ secrets.FTN_PRODUCTION_HOST }}
          FTN_PRODUCTION_USER: ${{ secrets.FTN_PRODUCTION_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ftn_deploy_key -p "$FTN_SSH_PORT" -o BatchMode=yes \
            "$FTN_PRODUCTION_USER@$FTN_PRODUCTION_HOST" \
            'set -euo pipefail; curl --fail --silent --show-error http://127.0.0.1:8080/healthz; curl --fail --silent --show-error http://127.0.0.1:8080/readyz'

      - name: Roll back application release on activation or health failure
        if: failure() && (steps.activate.outcome == 'failure' || steps.health.outcome == 'failure')
        env:
          FTN_PRODUCTION_HOST: ${{ secrets.FTN_PRODUCTION_HOST }}
          FTN_PRODUCTION_USER: ${{ secrets.FTN_PRODUCTION_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ftn_deploy_key -p "$FTN_SSH_PORT" -o BatchMode=yes \
            "$FTN_PRODUCTION_USER@$FTN_PRODUCTION_HOST" \
            "sudo -n bash '$FTN_RELEASE_ROOT/current/deploy/one-click/rollback.sh'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ftn_deploy_key
