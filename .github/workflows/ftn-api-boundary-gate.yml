name: FTN API Boundary Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftn-api-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Authentication, readiness and metrics boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTN_DB_PASSWORD: ci-api-boundary-password
      FTN_API_AUTH_TOKEN: ci-api-boundary-token
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Compose
        working-directory: services/control-plane
        run: docker compose config --quiet

      - name: Start stack
        working-directory: services/control-plane
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          set -euo pipefail
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f services/control-plane/docker-compose.yml ps
          docker compose -f services/control-plane/docker-compose.yml logs --no-color control-plane
          exit 1

      - name: Verify public health and readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz

      - name: Verify public metrics
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8080/metrics | grep -E '^ftn_control_requests_total [0-9]+$'

      - name: Verify protected API rejects missing credentials
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/services)"
          test "$status" = "401"

      - name: Verify protected API rejects invalid credentials
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer invalid-token' http://127.0.0.1:8080/api/v1/services)"
          test "$status" = "401"

      - name: Verify valid credential reaches authorization layer
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error -H "Authorization: Bearer ${FTN_API_AUTH_TOKEN}" http://127.0.0.1:8080/api/v1/services)"
          printf '%s' "$body" | grep -q '"services"'

      - name: Verify security headers
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error -D - -o /dev/null http://127.0.0.1:8080/healthz)"
          printf '%s' "$headers" | grep -iq '^X-Content-Type-Options: nosniff'
          printf '%s' "$headers" | grep -iq '^X-Frame-Options: DENY'
          printf '%s' "$headers" | grep -iq '^Referrer-Policy: no-referrer'

      - name: Shutdown cleanly
        if: always()
        working-directory: services/control-plane
        run: docker compose down -v --remove-orphans
