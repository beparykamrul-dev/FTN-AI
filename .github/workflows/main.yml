name: FTN-AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ftn-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd7d2d8a6b90f1b0 # v5.2.0
        with:
          go-version: '1.24.x'
          cache: true

      - name: Validate repository
        run: bash scripts/validate-repo.sh

      - name: Validate FTN architecture contracts
        run: bash scripts/validate-contracts.sh

      - name: Validate Go formatting
        working-directory: services/control-plane
        run: test -z "$(gofmt -l .)"

      - name: Test control plane
        working-directory: services/control-plane
        run: go test ./...

      - name: Build control plane
        working-directory: services/control-plane
        run: go build -trimpath ./...

      - name: Validate control-plane Dockerfile
        run: docker build -f services/control-plane/Dockerfile .

      - name: Validate FTN observability Compose
        working-directory: deployment/observability
        env:
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: ci-observability-password
          KOPIA_PASSWORD: ci-kopia-repository-password
          KOPIA_SERVER_USERNAME: ci-kopia
          KOPIA_SERVER_PASSWORD: ci-kopia-server-password
          KOPIA_VERSION: latest
        run: docker compose -f docker-compose.yml --profile observability --profile backup --profile wireless config --quiet

      - name: Validate FTN control center assets
        run: |
          node --check frontend/control-center/control-center.js
          test -s frontend/control-center/index.html
          test -s frontend/control-center/control-center.css
          test -s deployment/control-center/nginx.conf

      - name: Validate FTN control center Compose
        working-directory: deployment/control-center
        env:
          FTN_API_AUTH_TOKEN: ci-control-token
          DATABASE_URL: postgres://ftn:ci-password@localhost:5432/ftn?sslmode=disable
        run: docker compose -f docker-compose.yml config --quiet
