name: FTN Control Plane Build Gate

on:
  push:
    branches:
      - fix/provider-upstream-rpf-2
    paths:
      - 'services/control-plane/**'
      - '.github/workflows/ftn-control-plane-build-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/control-plane/**'
      - '.github/workflows/ftn-control-plane-build-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftn-control-plane-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go 1.24 control-plane build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache-dependency-path: services/control-plane/go.sum

      - name: Verify control-plane module
        run: cd services/control-plane && go env GOMOD && go mod verify

      - name: Format gate
        run: |
          cd services/control-plane
          files="$(find . -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Static analysis
        run: cd services/control-plane && go vet ./...

      - name: Unit tests
        run: cd services/control-plane && go test ./...

      - name: Production binary build
        run: cd services/control-plane && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/ftn-control-plane .

      - name: Container build gate
        run: docker build -f services/control-plane/Dockerfile -t ftn-control-plane:ci .
