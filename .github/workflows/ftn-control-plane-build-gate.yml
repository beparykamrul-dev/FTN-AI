name: FTN Control Plane Build Gate

on:
  push:
    branches:
      - fix/provider-upstream-rpf-2
    paths:
      - 'services/control-plane/**'
      - '.github/workflows/ftn-control-plane-build-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/control-plane/**'
      - '.github/workflows/ftn-control-plane-build-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftn-control-plane-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go 1.24 control-plane build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cdca6cd4ab8a6b3b # v5.2.0
        with:
          go-version: '1.24'
          cache-dependency-path: services/control-plane/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Format gate
        run: |
          test -z "$(gofmt -l .)"

      - name: Static analysis
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Production binary build
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/ftn-control-plane .

      - name: Container build gate
        working-directory: .
        run: docker build -f services/control-plane/Dockerfile -t ftn-control-plane:ci .
