name: FTN Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ftn-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security and approval boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject embedded credentials and private keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path('.')
          excluded = {'.git', '.github/workflows/ftn-security-gate.yml', 'go.sum'}
          patterns = [
              re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY'),
              re.compile(r'aws_secret_access_key\s*[:=]\s*[^$\s"\']'),
              re.compile(r'api[_-]?key\s*[:=]\s*[^$\s"\']'),
              re.compile(r'password\s*:\s*[^$\s"\']'),
              re.compile(r'password\s*=\s*[^$\s"\']'),
          ]

          found = False
          for path in root.rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  for pattern in patterns:
                      if pattern.search(line):
                          print(f'{path}:{lineno}:{line}')
                          print(f'Potential embedded credential/private key found: {pattern.pattern}')
                          found = True
          if found:
              sys.exit(1)
          PY

      - name: Check workflow action pinning
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r file; do
            while IFS= read -r line; do
              if [[ "$line" =~ uses:[[:space:]]*[^[:space:]@]+@[^[:space:]]+ ]] && [[ ! "$line" =~ uses:[[:space:]]*[^[:space:]@]+@[0-9a-f]{40}([[:space:]]|$) ]]; then
                echo "Unpinned action in $file: $line"
                bad=1
              fi
            done < "$file"
          done < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')
          exit "$bad"

      - name: Validate approval-first implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n 'requirePermission(a,"approval.create"' services/control-plane
          grep -R -n 'requirePermission(a,"approval.decide"' services/control-plane
          grep -R -n 'approval_required\|approval_not_approved' services/control-plane
          grep -R -n 'job.rollback' services/control-plane
          grep -R -n 'audit(' services/control-plane

      - name: Run control-plane tests
        working-directory: services/control-plane
        run: go test ./...
