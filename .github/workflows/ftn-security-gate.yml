name: FTN Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ftn-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security and approval boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject embedded credentials and private keys
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
            'aws_secret_access_key[[:space:]]*[:=][[:space:]]*["'"'][A-Za-z0-9/+=_-]{16,}["'"']'
            'api[_-]?key[[:space:]]*[:=][[:space:]]*["'"'][A-Za-z0-9/+=_-]{16,}["'"']'
            'password[[:space:]]*[:=][[:space:]]*["'"'][A-Za-z0-9/+=_-]{16,}["'"']'
          )
          for pattern in "${patterns[@]}"; do
            if git grep -nEI "$pattern" -- ':!go.sum' ':!.github/workflows/ftn-security-gate.yml'; then
              echo "Potential embedded credential/private key found for pattern: $pattern"
              exit 1
            fi
          done

      - name: Check workflow action pinning
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r file; do
            [[ "$file" == ".github/workflows/ftn-security-gate.yml" ]] && continue
            while IFS= read -r line; do
              if [[ "$line" =~ uses:[[:space:]]*[^[:space:]@]+@[^[:space:]]+ ]] && [[ ! "$line" =~ uses:[[:space:]]*[^[:space:]@]+@[0-9a-f]{40}([[:space:]]|$) ]]; then
                echo "Unpinned action in $file: $line"
                bad=1
              fi
            done < "$file"
          done < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')
          exit "$bad"

      - name: Validate approval-first implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n 'requirePermission(a,"approval.create"' services/control-plane
          grep -R -n 'requirePermission(a,"approval.decide"' services/control-plane
          grep -R -n 'approval_required\|approval_not_approved' services/control-plane
          grep -R -n 'job.rollback' services/control-plane
          grep -R -n 'job.verify' services/control-plane
          grep -R -n 'verified_by' services/control-plane
          grep -R -n 'audit(' services/control-plane

      - name: Validate tenant and identity boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n 'tenant_id=$' services/control-plane/*.go services/control-plane/migrations/*.sql
          grep -R -n 'requestScopedHash' services/control-plane/*.go
          grep -R -n 'verification_separation_required' services/control-plane
          grep -R -n 'tenant_scoped' services/control-plane/migrations

      - name: Run control-plane tests
        working-directory: services/control-plane
        run: go test ./...
