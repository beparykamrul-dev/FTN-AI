name: FTN Control Plane CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ftn-control-plane-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: services/control-plane/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Download dependencies
        env:
          GOPROXY: direct
        run: go mod download
      - name: Verify dependencies
        env:
          GOPROXY: direct
        run: go mod verify
      - name: Check module consistency
        run: go mod tidy -diff
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose
        env:
          FTN_DB_PASSWORD: ci-only-password
        run: docker compose -f services/control-plane/docker-compose.yml config --quiet
