name: Build and Attest

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build artifact
        run: |
          # আপনার বিল্ড করার কমান্ড এখানে দিন (যেমন: npm run build)
          mkdir -p dist
          echo "Hello World" > dist/app.txt

      # বিল্ড করা ফাইলের জন্য অ্যাটাস্টমেন্ট বা প্রুভেনেন্স জেনারেট করুন
      - name: Attest Build Provenance
        uses: actions/attest@v1
        with:
          subject-path: 'dist/app.txt'
