name: FTN Native Multi-Protocol Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd7d2d8a6b90f1b0 # v5.2.0
        with:
          go-version: '1.24.x'
          cache: true
      - name: Validate FTN native protocol fabric
        run: bash scripts/ftn-native-protocol-gate.sh
      - name: Test control-plane protocol engine
        working-directory: services/control-plane
        run: go test ./...
