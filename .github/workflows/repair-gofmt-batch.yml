name: FTN Go Format Repair Batch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ftn-gofmt-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.24.x'

      - name: Format latest 25-file repair batch
        run: |
          gofmt -w \
            services/ftn-codec/codec.go \
            services/ftn-mesh/contracts.go \
            services/ftn-dns/adapters/rr.go \
            apps/ftn-social/realtime/hub.go \
            internal/platform/agent/quota.go \
            internal/platform/agent/usage.go \
            internal/platform/agent/router.go \
            internal/platform/agent/fleet.go \
            internal/platform/agent/orchestrator.go \
            internal/platform/agent/health.go \
            internal/platform/agent/layers.go \
            internal/platform/agent/decision.go \
            internal/platform/agent/heartbeat.go \
            services/ftnwan-router/contracts/router.go \
            internal/platform/edge/core_router.go \
            internal/platform/edge/local_router.go \
            internal/platform/control/command_router.go \
            services/control-plane/core_router.go \
            services/control-plane/core_router_integration.go \
            services/control-plane/routeros_adapter.go \
            services/control-plane/events.go \
            services/control-plane/dns_guard.go \
            services/control-plane/qkd_contract.go \
            services/control-plane/ftn_routed_bgp_live.go \
            services/control-plane/exrouter.go

      - name: Commit repaired files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required in this batch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/ftn-codec/codec.go \
            services/ftn-mesh/contracts.go \
            services/ftn-dns/adapters/rr.go \
            apps/ftn-social/realtime/hub.go \
            internal/platform/agent/quota.go \
            internal/platform/agent/usage.go \
            internal/platform/agent/router.go \
            internal/platform/agent/fleet.go \
            internal/platform/agent/orchestrator.go \
            internal/platform/agent/health.go \
            internal/platform/agent/layers.go \
            internal/platform/agent/decision.go \
            internal/platform/agent/heartbeat.go \
            services/ftnwan-router/contracts/router.go \
            internal/platform/edge/core_router.go \
            internal/platform/edge/local_router.go \
            internal/platform/control/command_router.go \
            services/control-plane/core_router.go \
            services/control-plane/core_router_integration.go \
            services/control-plane/routeros_adapter.go \
            services/control-plane/events.go \
            services/control-plane/dns_guard.go \
            services/control-plane/qkd_contract.go \
            services/control-plane/ftn_routed_bgp_live.go \
            services/control-plane/exrouter.go
          git commit -m 'chore: repair latest 25 Go files'
          git push origin HEAD:main

      - name: Verify formatting on pull requests
        if: github.event_name == 'pull_request'
        run: test -z "$(gofmt -l .)"
