name: FTN Go Format Repair Batch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ftn-gofmt-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.24.x'

      - name: Format next 25-file repair batch
        run: |
          set -euo pipefail
          gofmt -w \
            internal/platform/ftndns/query_dedup.go \
            internal/platform/ftndns/cloud_state.go \
            internal/platform/ftndns/mesh_health.go \
            internal/platform/ftndns/edge_cache.go \
            internal/platform/controlplane/server_target.go \
            internal/platform/edge/local_router.go \
            internal/platform/edge/core_router.go \
            services/control-plane/flow_metrics.go \
            services/control-plane/flow_sequence.go \
            services/control-plane/ftn_main_server_service_plane.go \
            services/control-plane/ftn_service_protocol.go \
            services/control-plane/exrouter.go \
            services/control-plane/job_events.go \
            services/control-plane/rollback.go \
            services/control-plane/heartbeat.go \
            services/control-plane/ftn_routed.go \
            internal/platform/edge/client_enrollment.go \
            internal/platform/edge/client_profiles.go \
            internal/platform/edge/client_tunnel.go \
            internal/platform/edge/android_network.go \
            internal/platform/edge/fastly_patterns.go \
            internal/platform/edge/intent.go \
            internal/platform/edge/production_adapter.go \
            internal/platform/edge/olt.go

      - name: Commit repaired files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required in this batch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            internal/platform/ftndns/query_dedup.go \
            internal/platform/ftndns/cloud_state.go \
            internal/platform/ftndns/mesh_health.go \
            internal/platform/ftndns/edge_cache.go \
            internal/platform/controlplane/server_target.go \
            internal/platform/edge/local_router.go \
            internal/platform/edge/core_router.go \
            services/control-plane/flow_metrics.go \
            services/control-plane/flow_sequence.go \
            services/control-plane/ftn_main_server_service_plane.go \
            services/control-plane/ftn_service_protocol.go \
            services/control-plane/exrouter.go \
            services/control-plane/job_events.go \
            services/control-plane/rollback.go \
            services/control-plane/heartbeat.go \
            services/control-plane/ftn_routed.go \
            internal/platform/edge/client_enrollment.go \
            internal/platform/edge/client_profiles.go \
            internal/platform/edge/client_tunnel.go \
            internal/platform/edge/android_network.go \
            internal/platform/edge/fastly_patterns.go \
            internal/platform/edge/intent.go \
            internal/platform/edge/production_adapter.go \
            internal/platform/edge/olt.go
          git commit -m 'chore: repair next 25 Go files'
          git push origin HEAD:main

      - name: Verify formatting on pull requests
        if: github.event_name == 'pull_request'
        run: test -z "$(gofmt -l .)"
