name: FTN Go Format Repair Batch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ftn-gofmt-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.24.x'

      - name: Format next 25-file repair batch
        run: |
          set -euo pipefail
          gofmt -w \
            internal/platform/dns/adapters.go \
            internal/platform/dns/powerdns_sdk.go \
            internal/platform/dns/provider_adapter.go \
            internal/platform/dns/powerdns_adapter.go \
            services/ftn-dns/adapter.go \
            internal/platform/gis/api.go \
            internal/platform/gis/geo.go \
            internal/platform/gis/map.go \
            services/ftn-proxy/health.go \
            services/ftn-proxy/policy.go \
            internal/platform/dns/dkim.go \
            services/dns-domain/ptr.go \
            contracts/v1/ftnftp.go \
            contracts/v1/local_media.go \
            os/ftn-os/runtime/health.go \
            apps/ftn-social/realtime/delivery.go \
            apps/ftn-social/realtime/protocol.go \
            apps/ftn-social/realtime/transport.go \
            internal/platform/modules/fiber/module.go \
            internal/platform/modules/dns/definition.go \
            internal/platform/modules/mesh/definition.go \
            internal/platform/modules/fiber/definition.go \
            internal/platform/modules/monitoring/definition.go \
            internal/platform/gis/ipam.go \
            internal/platform/gis/fiber.go

      - name: Commit repaired files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required in this batch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            internal/platform/dns/adapters.go \
            internal/platform/dns/powerdns_sdk.go \
            internal/platform/dns/provider_adapter.go \
            internal/platform/dns/powerdns_adapter.go \
            services/ftn-dns/adapter.go \
            internal/platform/gis/api.go \
            internal/platform/gis/geo.go \
            internal/platform/gis/map.go \
            services/ftn-proxy/health.go \
            services/ftn-proxy/policy.go \
            internal/platform/dns/dkim.go \
            services/dns-domain/ptr.go \
            contracts/v1/ftnftp.go \
            contracts/v1/local_media.go \
            os/ftn-os/runtime/health.go \
            apps/ftn-social/realtime/delivery.go \
            apps/ftn-social/realtime/protocol.go \
            apps/ftn-social/realtime/transport.go \
            internal/platform/modules/fiber/module.go \
            internal/platform/modules/dns/definition.go \
            internal/platform/modules/mesh/definition.go \
            internal/platform/modules/fiber/definition.go \
            internal/platform/modules/monitoring/definition.go \
            internal/platform/gis/ipam.go \
            internal/platform/gis/fiber.go
          git commit -m 'chore: repair next 25 Go files'
          git push origin HEAD:main

      - name: Verify formatting on pull requests
        if: github.event_name == 'pull_request'
        run: test -z "$(gofmt -l .)"
