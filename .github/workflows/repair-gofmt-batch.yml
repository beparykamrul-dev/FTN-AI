name: FTN Go Format Repair Batch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ftn-gofmt-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.24.x'

      - name: Format next 25-file repair batch
        run: |
          set -euo pipefail
          gofmt -w \
            services/ftn-mail/transport/listener.go \
            services/ftn-mail/transport/delivery.go \
            services/ftn-mail/transport/smtp_policy.go \
            services/ftn-mail/transport/rate_limiter.go \
            services/ftn-mail/transport/auth_exchange.go \
            services/ftn-mail/transport/smtp_receiver.go \
            services/ftn-mail/transport/identity_auth.go \
            services/ftn-mail/transport/auth_throttle.go \
            services/ftn-mail/transport/admission_guard.go \
            services/ftn-mail/transport/credential_verify.go \
            services/ftn-mail/transport/mailbox_authorizer.go \
            services/ftn-mail/transport/admission_middleware.go \
            services/ftn-mail/transport/smtp_session.go \
            services/ftn-mail/outbound/smtp_sender.go \
            services/ftn-sms/transport/transport.go \
            internal/platform/mesh/events.go \
            internal/platform/mesh/probe_scheduler.go \
            internal/platform/dns/anycast_scheduler.go \
            internal/platform/ftndns/resolver_workload.go \
            internal/platform/ftndns/resolver_prefetch.go \
            internal/platform/authenticator/authenticator.go \
            internal/platform/dns/active_probe.go \
            internal/platform/dns/bgp_gobgp_adapter.go \
            internal/platform/dns/mesh_anycast.go

      - name: Commit repaired files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required in this batch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/ftn-mail/transport/listener.go \
            services/ftn-mail/transport/delivery.go \
            services/ftn-mail/transport/smtp_policy.go \
            services/ftn-mail/transport/rate_limiter.go \
            services/ftn-mail/transport/auth_exchange.go \
            services/ftn-mail/transport/smtp_receiver.go \
            services/ftn-mail/transport/identity_auth.go \
            services/ftn-mail/transport/auth_throttle.go \
            services/ftn-mail/transport/admission_guard.go \
            services/ftn-mail/transport/credential_verify.go \
            services/ftn-mail/transport/mailbox_authorizer.go \
            services/ftn-mail/transport/admission_middleware.go \
            services/ftn-mail/transport/smtp_session.go \
            services/ftn-mail/outbound/smtp_sender.go \
            services/ftn-sms/transport/transport.go \
            internal/platform/mesh/events.go \
            internal/platform/mesh/probe_scheduler.go \
            internal/platform/dns/anycast_scheduler.go \
            internal/platform/ftndns/resolver_workload.go \
            internal/platform/ftndns/resolver_prefetch.go \
            internal/platform/authenticator/authenticator.go \
            internal/platform/dns/active_probe.go \
            internal/platform/dns/bgp_gobgp_adapter.go \
            internal/platform/dns/mesh_anycast.go
          git commit -m 'chore: repair next 25 Go files'
          git push origin HEAD:main

      - name: Verify formatting on pull requests
        if: github.event_name == 'pull_request'
        run: test -z "$(gofmt -l .)"
