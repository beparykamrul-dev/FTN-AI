name: FTN Migration Validation Gate

on:
  push:
    branches:
      - main
      - fix/provider-upstream-rpf-2
    paths:
      - 'services/control-plane/migrations/**'
      - 'services/control-plane/schema.sql'
      - 'services/control-plane/scripts/migrate.sh'
      - 'services/control-plane/scripts/validate_migrations.sh'
      - 'services/control-plane/tests/sql/**'
      - 'scripts/validate-db-restore.sh'
      - '.github/workflows/ftn-migration-validation-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/control-plane/migrations/**'
      - 'services/control-plane/schema.sql'
      - 'services/control-plane/scripts/migrate.sh'
      - 'services/control-plane/scripts/validate_migrations.sh'
      - 'services/control-plane/tests/sql/**'
      - 'scripts/validate-db-restore.sh'
      - '.github/workflows/ftn-migration-validation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftn-migration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-validation:
    name: PostgreSQL 015-024 migration + restore + execution-integrity validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: PostgreSQL client check
        run: psql --version

      - name: Validate migration chain and PostgreSQL execution order
        env:
          MIGRATION_VALIDATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_VALIDATION_ALLOW_CREATE: '1'
        run: bash services/control-plane/scripts/validate_migrations.sh

      - name: Validate full database backup and restore path
        run: bash scripts/validate-db-restore.sh

      - name: Replay migrations into isolated semantic-test database
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          db="ftn_semantic_gate_${GITHUB_RUN_ID}"
          cleanup() { psql "$PGURL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE);" >/dev/null || true; }
          trap cleanup EXIT
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$db\";" >/dev/null
          psql "$PGURL" -d "$db" -X -v ON_ERROR_STOP=1 -f services/control-plane/schema.sql >/dev/null
          mapfile -t migrations < <(find services/control-plane/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort -V)
          declare -A seen_version=()
          for file in "${migrations[@]}"; do
            version="${file%%_*}"
            [[ "$version" =~ ^[0-9]+$ ]] || continue
            if [[ -n "${seen_version[$((10#$version))]:-}" ]]; then
              echo "duplicate migration version: $file conflicts with ${seen_version[$((10#$version))]}" >&2
              exit 1
            fi
            seen_version[$((10#$version))]="$file"
            echo "Applying $file"
            psql "$PGURL" -d "$db" -X -v ON_ERROR_STOP=1 -f "services/control-plane/migrations/$file" >/dev/null
          done
          for version in {15..24}; do
            [[ -n "${seen_version[$version]:-}" ]] || { echo "missing migration version: $(printf '%03d' "$version")" >&2; exit 1; }
          done
          psql "$PGURL" -d "$db" -X -v ON_ERROR_STOP=1 -f services/control-plane/tests/sql/024_execution_integrity_state_machine.sql
