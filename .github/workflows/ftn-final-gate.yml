name: FTN Final Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ftn-final-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.x'
          cache: true
      - name: Go format
        run: |
          files=$(gofmt -l .)
          test -z "$files" || { echo "$files"; exit 1; }
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Validate shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Validate YAML and JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          try:
              import yaml
          except ImportError:
              print('PyYAML unavailable'); sys.exit(1)
          for p in Path('.').rglob('*'):
              if '.git' in p.parts or not p.is_file():
                  continue
              if p.suffix.lower() in {'.yaml','.yml'}:
                  yaml.safe_load(p.read_text())
              elif p.suffix.lower()=='.json':
                  json.loads(p.read_text())
          print('config validation: PASS')
          PY
      - name: Final integrity check
        run: bash scripts/ftn-final-integrity-check.sh
