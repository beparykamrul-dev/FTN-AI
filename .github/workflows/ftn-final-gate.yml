name: FTN Final Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftn-final-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FTN_DB_PASSWORD: ci-final-gate-password
      FTN_API_AUTH_TOKEN: ci-final-gate-token
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Repository validation
        run: bash scripts/validate-repo.sh
      - name: Go final integrity
        run: bash scripts/ftn-final-integrity-check.sh
      - name: Validate shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Validate Compose
        working-directory: services/control-plane
        run: docker compose config --quiet
      - name: Build production Compose images
        working-directory: services/control-plane
        run: docker compose build --pull
      - name: Start integration stack
        working-directory: services/control-plane
        run: docker compose up -d --remove-orphans
      - name: Verify migration runner and service health
        working-directory: services/control-plane
        run: |
          set -euo pipefail
          for i in {1..60}; do
            status="$(docker compose ps --status exited --format '{{.Service}}:{{.ExitCode}}' migration-runner 2>/dev/null || true)"
            if [[ "$status" == migration-runner:0 ]]; then break; fi
            sleep 2
          done
          docker compose ps
          docker compose ps --status exited --format '{{.Service}}:{{.ExitCode}}' | grep -q '^migration-runner:0$'
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color --tail=200 postgres migration-runner control-plane
          exit 1
      - name: Verify API, database-backed readiness and metrics
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          curl --fail --silent http://127.0.0.1:8080/metrics | grep -E '^ftn_control_requests_total [0-9]+$'
      - name: Frontend manifest validation when present
        run: |
          set -euo pipefail
          mapfile -t manifests < <(git ls-files '*package.json' | sort -u)
          if ((${#manifests[@]} == 0)); then
            echo 'No JavaScript package manifest in repository; frontend build gate not applicable.'
            exit 0
          fi
          command -v node >/dev/null
          command -v npm >/dev/null
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "validating frontend manifest: $manifest"
            (cd "$dir" && npm install --ignore-scripts --no-audit --no-fund)
            (cd "$dir" && npm run build --if-present)
            (cd "$dir" && npm run typecheck --if-present)
          done
      - name: Shutdown integration stack
        if: always()
        working-directory: services/control-plane
        run: docker compose down -v --remove-orphans
