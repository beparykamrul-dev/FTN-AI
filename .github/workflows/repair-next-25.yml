name: FTN Go Repair Next 25

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftn-go-repair-next-25-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
      - name: Check Go formatting across repository
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.go' | sort)
          bad=()
          for file in "${files[@]}"; do
            if [[ -n "$(gofmt -l "$file")" ]]; then bad+=("$file"); fi
          done
          if ((${#bad[@]})); then
            printf 'Unformatted Go files:\n%s\n' "${bad[@]}"
            exit 1
          fi
          echo "All ${#files[@]} tracked Go files are gofmt-clean."
