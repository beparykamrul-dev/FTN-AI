name: FTN Production Launch Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ftn-production-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Production launch preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify production inputs are not placeholders
        shell: bash
        run: |
          set -euo pipefail
          test -f services/control-plane/Dockerfile
          test -f services/control-plane/docker-compose.yml
          test -f services/control-plane/go.mod
          if grep -RniE 'ccr\.ccs\.tencentyun\.com/demo|cls-mywebapp|tke-test' .github/workflows; then
            echo 'Production deployment still contains placeholder TKE values.'
            exit 1
          fi

      - name: Validate repository
        run: bash scripts/validate-repo.sh

      - name: Validate architecture contracts
        run: bash scripts/validate-contracts.sh

      - name: Build control plane
        working-directory: services/control-plane
        run: go build -trimpath ./...

      - name: Test control plane
        working-directory: services/control-plane
        run: go test ./...

      - name: Validate Compose
        working-directory: services/control-plane
        env:
          FTN_DB_PASSWORD: ci-launch-password
        run: docker compose config --quiet

      - name: Publish launch evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 18 --body "Production launch gate executed for ${GITHUB_SHA}. Repository, architecture, Go build/test and Compose preflight were evaluated. Real infrastructure deployment remains blocked until production deployment inputs are configured and the protected gates are green."
