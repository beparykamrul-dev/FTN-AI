name: FTN Production Launch Gate

on:
  workflow_dispatch:
    inputs:
      launch_evidence_issue:
        description: 'Optional GitHub issue number for launch evidence'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ftn-production-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: FTN-owned production preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify FTN-owned runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f services/control-plane/Dockerfile
          test -f services/control-plane/docker-compose.yml
          test -f services/control-plane/go.mod
          test -f services/control-plane/schema.sql
          test -f services/control-plane/migrations/002_platform_foundation.sql
          test -f services/control-plane/migrations/003_durable_execution.sql
          test -f services/control-plane/migrations/004_approval_execution.sql
          test -f services/control-plane/migrations/005_job_integrity_leases.sql
          test -f services/control-plane/migrations/006_job_event_automation.sql
          test -f services/control-plane/migrations/017_active_defense_execution.sql
          test -f services/control-plane/migrations/018_tenant_scoped_active_defense_idempotency.sql
          test -f services/control-plane/migrations/019_tenant_scoped_service_requests.sql
          test -f services/control-plane/migrations/020_tenant_scoped_api_idempotency.sql
          test -f services/control-plane/migrations/021_verification_identity.sql

      - name: Validate repository
        run: bash scripts/validate-repo.sh

      - name: Validate architecture contracts
        run: bash scripts/validate-contracts.sh

      - name: Build control plane
        working-directory: services/control-plane
        run: go build -trimpath ./...

      - name: Test control plane
        working-directory: services/control-plane
        run: go test ./...

      - name: Validate Compose
        working-directory: services/control-plane
        env:
          FTN_DB_PASSWORD: ci-launch-password
        run: docker compose config --quiet

      - name: Publish launch evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ISSUE: ${{ inputs.launch_evidence_issue }}
        shell: bash
        run: |
          set -euo pipefail
          body="FTN-owned production preflight executed for ${GITHUB_SHA}. TKE deployment parameters remain intentionally deferred. Repository, architecture, Go build/test and Compose preflight were evaluated; real infrastructure launch still requires the FTN-owned deployment target and protected integration/recovery gates."
          if [[ -n "$EVIDENCE_ISSUE" ]]; then
            [[ "$EVIDENCE_ISSUE" =~ ^[0-9]+$ ]] || { echo 'launch_evidence_issue must be numeric' >&2; exit 1; }
            gh issue comment "$EVIDENCE_ISSUE" --body "$body"
          else
            printf '%s\n' "$body"
          fi
