# This workflow builds, publishes and deploys the FTN-AI control-plane container to Tencent Kubernetes Engine (TKE).
# The repository is a multi-service monorepo, so the Docker build context must point at the
# service Dockerfile instead of assuming a repository-root Dockerfile exists.
name: Tencent Kubernetes Engine

on:
  push:
    branches: [main]

env:
  TKE_IMAGE_URL: ccr.ccs.tencentyun.com/demo/mywebapp
  TKE_REGION: ap-guangzhou
  TKE_CLUSTER_ID: cls-mywebapp
  DEPLOYMENT_NAME: tke-test
  DOCKERFILE: services/control-plane/Dockerfile

permissions:
  contents: read

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify build inputs
        run: |
          test -f "$DOCKERFILE"
          test -f services/control-plane/go.mod
          test -f services/control-plane/go.sum

      - name: Build Docker image
        run: docker build --file "$DOCKERFILE" --tag "${TKE_IMAGE_URL}:${GITHUB_SHA}" .

      - name: Login TKE Registry
        env:
          TKE_REGISTRY_PASSWORD: ${{ secrets.TKE_REGISTRY_PASSWORD }}
          TENCENT_CLOUD_ACCOUNT_ID: ${{ secrets.TENCENT_CLOUD_ACCOUNT_ID }}
        run: |
          printf '%s' "$TKE_REGISTRY_PASSWORD" | docker login "$(dirname "$TKE_IMAGE_URL")" \
            --username "$TENCENT_CLOUD_ACCOUNT_ID" --password-stdin

      - name: Publish
        run: docker push "${TKE_IMAGE_URL}:${GITHUB_SHA}"

      - name: Set up Kustomize
        run: |
          curl --fail --silent --show-error --location \
            --output kustomize \
            https://github.com/kubernetes-sigs/kustomize/releases/download/v3.1.0/kustomize_3.1.0_linux_amd64
          chmod u+x ./kustomize

      - name: Set up ~/.kube/config for connecting TKE cluster
        uses: TencentCloud/tke-cluster-credential-action@b1071cab5dd4cebc26a6b7905cb42ac66156b29e # v1
        with:
          secret_id: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          tke_region: ${{ env.TKE_REGION }}
          cluster_id: ${{ env.TKE_CLUSTER_ID }}

      - name: Switch to TKE context
        run: kubectl config use-context "${TKE_CLUSTER_ID}-context-default"

      - name: Deploy
        run: |
          ./kustomize edit set image "${TKE_IMAGE_URL}:${GITHUB_SHA}"
          ./kustomize build . | kubectl apply -f -
          kubectl rollout status "deployment/${DEPLOYMENT_NAME}"
          kubectl get services -o wide
