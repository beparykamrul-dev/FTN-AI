# TKE deployment is intentionally deferred until FTN production infrastructure is ready.
# This workflow is manual-only so placeholder TKE values can never deploy on push.
name: Tencent Kubernetes Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deferred:
    name: TKE deployment deferred
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment boundary
        run: |
          echo "TKE deployment is intentionally deferred."
          echo "Configure real TKE image, region, cluster and deployment values before enabling it."
          echo "FTN-owned production deployment is the active launch path."
