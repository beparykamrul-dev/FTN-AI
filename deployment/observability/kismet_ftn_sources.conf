# FTN Kismet datasource profiles.
# These entries are intentionally opt-in: enable only sources attached to an
# FTN-owned/managed sensor node and authorized for collection.
#
# Linux Wi-Fi examples:
# source=wlan0:name=FTN-WiFi-0,type=linuxwifi
# source=wlan1:name=FTN-WiFi-1,type=linuxwifi
#
# Bluetooth HCI discovery:
# source=hci0:name=FTN-Bluetooth-0,type=linuxbluetooth
#
# RTL-SDR sensor telemetry via rtl_433:
# source=rtl433-0:name=FTN-SDR-RTL433,type=rtl433
#
# Zigbee adapters are hardware-specific. Use the matching Kismet datasource
# documented for the adapter instead of guessing a capture type.
#
# Keep this file free of customer/device allowlists. Authorization and scope
# belong to the FTN control-plane policy layer; Kismet is the sensor boundary.
