x-ftn-production-stack: true

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    profiles: [observability]
    environment:
      CLICKHOUSE_DB: ftn_analytics
      CLICKHOUSE_USER: ${FTN_CLICKHOUSE_USER:-ftn}
      CLICKHOUSE_PASSWORD: ${FTN_CLICKHOUSE_PASSWORD:?set FTN_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ftn-clickhouse:/var/lib/clickhouse
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - default
      - ftn-control-plane

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    restart: unless-stopped
    profiles: [observability]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      DISABLE_INSTALL_DEMO_CONFIG: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ftn-opensearch:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    restart: unless-stopped
    profiles: [observability]
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "false"
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:5601:5601"

  kopia:
    image: kopia/kopia:${KOPIA_VERSION:-latest}
    restart: unless-stopped
    profiles: [backup]
    environment:
      KOPIA_PASSWORD: ${KOPIA_PASSWORD:?set KOPIA_PASSWORD}
      USER: ftn
    command:
      - server
      - start
      - --address=0.0.0.0:51515
      - --server-username=${KOPIA_SERVER_USERNAME:?set KOPIA_SERVER_USERNAME}
      - --server-password=${KOPIA_SERVER_PASSWORD:?set KOPIA_SERVER_PASSWORD}
      - --disable-csrf-token-checks=false
    volumes:
      - ftn-kopia-config:/app/config
      - ftn-kopia-cache:/app/cache
      - ftn-kopia-logs:/app/logs
      - ftn-kopia-repository:/repository
      - /:/host:ro
      - ftn-kopia-tmp:/tmp:shared
    ports:
      - "127.0.0.1:51515:51515"

  kismet:
    image: kismetwireless/kismet:2025-09-R1
    restart: unless-stopped
    profiles: [wireless]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ftn-kismet-data:/var/log/kismet
      - ./kismet_site.conf:/etc/kismet/kismet_site.conf:ro
    ports: []

volumes:
  ftn-clickhouse:
  ftn-opensearch:
  ftn-kopia-config:
  ftn-kopia-cache:
  ftn-kopia-logs:
  ftn-kopia-repository:
  ftn-kopia-tmp:
  ftn-kismet-data:

networks:
  ftn-control-plane:
    external: true
    name: ftn-control-plane
