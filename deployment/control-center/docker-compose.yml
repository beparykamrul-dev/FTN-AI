x-ftn-production-stack: true

services:
  control-center:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ../../frontend/control-center:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ftn-control-plane

networks:
  ftn-control-plane:
    external: true
    name: ftn-control-plane
