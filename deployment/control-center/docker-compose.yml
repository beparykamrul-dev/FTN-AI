services:
  control-plane:
    build:
      context: ../..
      dockerfile: services/control-plane/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FTN_CONTROL_ADDR: ":8080"
      FTN_HEALTH_URL: "http://127.0.0.1:8080/healthz"
      FTN_API_AUTH_TOKEN: "${FTN_API_AUTH_TOKEN:?set FTN_API_AUTH_TOKEN}"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/ftn-control-plane", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  control-center:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ../../frontend/control-center:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-plane:
        condition: service_healthy
