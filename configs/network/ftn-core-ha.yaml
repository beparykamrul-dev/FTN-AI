apiVersion: ftn.network/v1
kind: CoreHighAvailability
metadata:
  name: ftn-core-ha
spec:
  topology:
    nodes:
      - id: core-a
        role: primary
      - id: core-b
        role: standby
    redundancy: n-plus-one
  routing:
    ipv4: true
    ipv6: true
    ebgp: true
    ibgp: true
    bfd: true
    ecmp: true
    graceful_restart: true
    rpki_validation: when-available
  failover:
    health_driven: true
    withdraw_unhealthy_paths: true
    preserve_established_sessions_when_possible: true
    recovery_verification_required: true
  safety:
    route_change_requires_approval: true
    prechange_snapshot: true
    postchange_verification: true
    rollback_when_safe: true
    external_targets: prohibited
  telemetry:
    peer_state: true
    route_events: true
    latency: true
    packet_loss: true
    capacity: true
