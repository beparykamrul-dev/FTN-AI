-- FTN DNS unified frontend
setLocal('0.0.0.0:53')
setLocal('[::]:53')

newServer({address='ftn-unbound:53', name='unbound', order=1})
newServer({address='ftn-coredns:53', name='coredns', order=2})

setServerPolicy(firstAvailable)
setECSSourcePrefixV4(0)
setECSSourcePrefixV6(0)
setMaxTCPClientThreads(4)

addAction(AllRule(), PoolAction('default'))

-- Do not enable query logging in production; metrics remain available via the
-- control plane/observability layer. TLS/HTTPS/QUIC certificates are supplied
-- by the deployment PKI and should not be committed to the repository.
