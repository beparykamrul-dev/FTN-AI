-- FTN DNS unified frontend
setLocal('0.0.0.0:53')
setLocal('[::]:53')

newServer({address='ftn-unbound:53', name='unbound', pool='default', order=1})
newServer({address='ftn-coredns:53', name='coredns', pool='default', order=2})

setServerPolicy(firstAvailable)
setECSSourcePrefixV4(0)
setECSSourcePrefixV6(0)
setMaxTCPClientThreads(4)

-- Production privacy baseline: no raw DNS query logging.
-- DoT/DoH/DoQ listeners are enabled only when deployment PKI material is
-- mounted; certificates/keys are intentionally never committed here.
