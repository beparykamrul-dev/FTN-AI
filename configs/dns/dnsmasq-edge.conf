# FTN edge-only dnsmasq profile.
# dnsdist remains the canonical DNS frontend on port 53. dnsmasq is bound to
# loopback port 5353 so it cannot collide with dnsdist or become a public
# resolver. Use this profile for local edge/management caching only.
port=5353
listen-address=127.0.0.1
bind-dynamic
no-resolv
no-hosts
cache-size=10000
local-ttl=60
neg-ttl=30
local-service
server=127.0.0.1#53
