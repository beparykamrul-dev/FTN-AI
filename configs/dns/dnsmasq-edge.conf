# FTN edge-only dnsmasq profile.
# This is intentionally NOT a recursive/public resolver: dnsdist remains the
# canonical DNS frontend. Use dnsmasq only on an FTN edge/management node for
# DHCP/local host discovery and a small local cache.
port=0
no-resolv
no-hosts
cache-size=10000
local-ttl=60
neg-ttl=30
local-service
bind-dynamic
# Upstream is the canonical FTN DNS frontend on the edge node.
server=127.0.0.1#53
