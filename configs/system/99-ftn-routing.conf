# FTN provider/upstream routing-node kernel profile.
# Loose reverse-path filtering is required for multihomed/asymmetric BGP paths.
# Do not disable RPF globally: mode 2 keeps source validation while allowing
# legitimate asymmetric routing.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.ip_forward = 1

# Keep IPv4 forwarding deterministic on routing nodes.
net.ipv4.conf.all.accept_local = 0
net.ipv4.conf.default.accept_local = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# IPv6 has no rp_filter equivalent; forwarding is enabled for dual-stack FTN nodes.
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
