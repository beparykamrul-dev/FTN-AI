apiVersion: ftn.ai/v1
kind: ConnectivityStack
metadata:
  name: ftn-connectivity
spec:
  dns:
    primaryDomain: familytimenet.com
    providerNeutral: true
  transports:
    wireguard:
      enabled: true
      role: primary
    amneziawg:
      enabled: true
      role: compatibility
    openvpn3:
      enabled: true
      role: compatibility
    gre:
      enabled: true
      role: routed-tunnel
    sslh:
      enabled: true
      role: edge-multiplexer
    shadowsocks:
      enabled: true
      role: proxy-compatibility
    hysteria2:
      enabled: true
      role: quic-transport
    xray:
      enabled: true
      role: transport-framework
    websocket:
      enabled: true
      role: application-transport
    grpc:
      enabled: true
      role: application-transport
    quic:
      enabled: true
      role: transport
    tls:
      enabled: true
      role: secure-transport
    dot:
      enabled: true
      role: dns-secure-transport
    doh:
      enabled: true
      role: dns-secure-transport
    doq:
      enabled: true
      role: dns-secure-transport
    pptp:
      enabled: false
      role: legacy-compatibility
  mesh:
    batmanAdv:
      enabled: true
    yggdrasil:
      enabled: true
    cjdns:
      enabled: true
    topology: full-mesh
  telemetry:
    netSA:
      enabled: true
      components: [silk, yaf, super_mediator]
    storage:
      analytical: clickhouse
  security:
    pki: required
    secretsServerSide: true
    approvalRequiredForPrivilegedChanges: true
    arbitraryShellCommands: false
    externalRestrictionBypass: false
  lifecycle:
    verifyAfterChange: true
    auditEveryOperation: true
    healthCheckBeforeSelection: true
    automaticFailoverForConnectivity: true
