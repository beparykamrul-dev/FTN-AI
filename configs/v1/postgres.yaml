# PostgreSQL Configuration

postgres:
  # Connection Pool
  pool:
    min_size: 5
    max_size: 20
    max_idle_time: 600
    connection_timeout: 30
  
  # Health Check
  health_check:
    enabled: true
    interval: 30
    timeout: 5
    
  # Performance Tuning
  performance:
    shared_buffers: "256MB"
    effective_cache_size: "1GB"
    work_mem: "16MB"
    random_page_cost: 1.1
    
  # Backup and Recovery
  backup:
    enabled: true
    schedule: "0 2 * * *"  # Daily at 2 AM
    retention_days: 30
    
  # Replication
  replication:
    enabled: false
    standby_servers: []