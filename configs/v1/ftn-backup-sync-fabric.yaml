version: v1
kind: FTNBackupSyncFabric
metadata:
  name: ftn-backup-sync-fabric
spec:
  services: [backup, replication, synchronization, restore]
  engines:
    block: capability-aware
    file: capability-aware
    object: capability-aware
  transfer:
    resumable: true
    deduplicated: true
    compressed: adaptive
    encrypted: true
  scheduling:
    capacity_aware: true
    latency_aware: true
    bulk_qos: true
  integrity:
    checksums: true
    verification: true
  recovery:
    point_in_time: true
    restore_validation: true
  telemetry:
    flow_id: true
    metrics: true
