version: v1
kind: FTNPeeringFabric
metadata:
  name: ftn-peering-fabric
spec:
  routing: [bgp, isis]
  peering:
    dynamic: true
    policy_aware: true
    health_aware: true
    latency_aware: true
  ix:
    integration_ready: true
  traffic_classes: [realtime, interactive, bulk]
  qos:
    dscp: true
  security:
    anti_spoofing: true
    zero_trust: true
    mtls_control_plane: true
  telemetry:
    ipfix: true
    netflow: true
    flow_correlation: true
  path_engine: exrouter
