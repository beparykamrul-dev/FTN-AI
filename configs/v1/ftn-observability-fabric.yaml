version: v1
kind: FTNObservabilityFabric
metadata:
  name: ftn-observability-fabric
spec:
  signals: [metrics, logs, traces, flows, events]
  collectors: [prometheus, opentelemetry, ipfix, netflow, syslog]
  flow_tools: [goflow2, yaf, rwflowpack, pmacct, silk]
  correlation: [service_id, node_id, device_id, flow_id, trace_id, path_id]
  tracing:
    opentelemetry: true
    jaeger_compatible: true
  flow:
    ipfix: true
    netflow_v5: true
    netflow_v9: true
    yaf: true
    silk: true
    rwflowpack: true
  logs:
    structured: true
    secrets_redacted: true
  sampling:
    adaptive: true
    overload_protection: true
  retention:
    bounded: true
    tiered: true
  security:
    payload_capture: disabled-by-default
  integration: [ftn-ai-network-control, ftn-dms-alert-engine, ftn-control-center, ftn-router-fabric]
