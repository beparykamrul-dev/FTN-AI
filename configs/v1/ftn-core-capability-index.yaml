version: v1
name: ftn-core-capability-index
purpose: single provider-neutral discovery index for FTN service placement, protocol composition, network health, AI network intelligence and control-panel resolution
registries:
  - ftn-os-module-registry.yaml
  - ftn-provider-registry.yaml
  - ftn-network-core-registry.yaml
  - ftn-sdn-repository-registry.yaml
  - ftn-unified-protocol-fabric.yaml
  - ftn-service-contract.yaml
  - ftn-service-discovery.yaml
  - ftn-transport-security-registry.yaml
  - ftn-transport-negotiation.yaml
  - ftn-telemetry-analysis-registry.yaml
  - ftn-observability-contract.yaml
  - ftn-resource-policy.yaml
  - ftn-path-qos-policy.yaml
  - ftn-database-fabric.yaml
  - ftn-cache-fabric.yaml
  - ftn-dns-fabric.yaml
  - ftn-mesh-fabric.yaml
  - ftn-dataplane-acceleration.yaml
  - ftn-media-runtime.yaml
  - ftn-alerting-fabric.yaml
  - ftn-dms-alerting.yaml
  - ftn-control-center.yaml
  - ftn-dashboard-contract.yaml
  - ftn-ai-network-bridge.yaml
  - ftn-approval-gate.yaml
  - ftn-security-baseline.yaml
  - ftn-deployment-contract.yaml

planes:
  control: {services: [control-plane, policy, approval, audit, rollback, ai]}
  compute: {services: [server-inventory, resource-balancer, service-placement, deployment]}
  network: {services: [router, ip-pool, vlan, firewall, routing, bgp, isis, network-health, exrouter]}
  dns_domain: {services: [dns, authoritative-dns, recursive-dns, domain, acme, certificate]}
  transport: {services: [wireguard, amneziawg, aether-core, hysteria2, shadowsocks, openvpn, ssl-vpn, gre, vxlan, ipsec, sslh, pptp]}
  mesh: {services: [full-mesh, overlay-fabric, netbird, zero-trust-gateway]}
  dataplane: {services: [ebpf, xdp, dpdk, vpp, fdio, openvswitch, ovn, kube-ovn, raw-socket, can]}
  storage: {services: [multi-database, storage-pool, backup, snapshot, synology, truenas-scale]}
  telemetry: {services: [prometheus, goflow2, netflow-v5, netflow-v9, ipfix, yaf, silk, rwflowpack, pmacct, opentelemetry, jaeger, wazuh]}
  media_acceleration: {services: [vaapi, intel-qsv, codec-runtime]}
  developer_ai: {services: [jupyter-notebook, ai-runtime]}
  virtualization: {services: [proxmox, kubernetes, container-networking]}
  testing: {services: [mininet, containernet, ns-3]}

fabric:
  model: unified-protocol-fabric
  provider_neutral_core: true
  vendor_neutral_core: true
  common_contract: [identity, discovery, policy, health, path-selection, transport, dataplane, telemetry, audit]
  protocol_composition: true
  language_selection_by_workload: true
  zero_copy_when_beneficial: true
  memory_to_memory: true

network_intelligence:
  health_module: true
  exrouter: true
  ai_bridge: ftn-ai-network-bridge
  metrics: [latency, rtt, packet-loss, jitter, throughput, retransmissions, health]
  hysteresis: true
  fastest_healthy_path: true
  privileged_actions: approval-gated

control_panel:
  contract: ftn-dashboard-contract
  shell: ftn-control-center
  realtime: true
  preview: true
  dry_run: true
  approval_gate: ftn-approval-gate
  rollback: true
  audit: true

resolution:
  server_selection: capability-health-capacity-policy
  resource_balance: cpu-ram-ssd-hdd-network
  failover: health-aware-path-selection
  deployment: versioned-audited-rollbackable

ai:
  role: network-intelligence-and-advisory-orchestrator
  direct_execution: false
  production_writes: approval-required
  audit: required
