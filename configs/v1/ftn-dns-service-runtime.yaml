version: v1
kind: FTNDNSServiceRuntime
metadata:
  name: ftn-dns-service-runtime
spec:
  planes:
    authoritative: true
    recursive: true
    cache: true
    discovery: true
  protocols: [dns, doh, dot]
  routing:
    health_aware: true
    latency_aware: true
    exrouter: true
  security:
    dnssec: true
    mtls_control: true
    anti_spoofing: true
  telemetry:
    query_metrics: true
    latency: true
    errors: true
  resilience:
    failover: true
    stale_rejection: true
