apiVersion: ftn.ai/v1
kind: GlobalDNSMesh
metadata:
  name: familytimenet-dns-mesh
spec:
  zone: familytimenet.com
  topology:
    local: full-mesh
    global: full-mesh
    latencyAware: true
    healthAware: true
    avoidFlapping: true
  routing:
    controlProtocol: gobgp
    addressIntelligence: geoip2
    routeSelection: [health, rtt, loss, jitter, utilization, locality]
  dns:
    architecture: provider-neutral
    nodeRegistry: required
    immutableContract: ftn-dns-v1
    configurationContract: ftn-dns-v1
    providerAdapterContract: ftn-dns-provider-v1
    sharedZoneContract: ftn-dns-shared-zone-v1
    sharedZone: familytimenet.com
    sharedZoneMode: logical-zone
    zoneSourceOfTruth: familytimenet-dns-registry
    zoneDistribution: registry-driven
    nodeLifecycle: register-validate-authenticate-health-sync-route
    addProviderWithoutRebuild: true
    addNodeWithoutReplacingExistingNodes: true
    removeNodeWithoutRebuildingZone: true
    familyTimeNetZoneSharedAcrossAllProviders: true
    familyTimeNetZoneSharedAcrossNodes: true
    perNodeConfiguration: true
    perProviderAdapterConfiguration: true
    consistencyChecks: true
    driftDetection: true
    serialCoordination: true
    healthGatedPublication: true
    roleAwareProviderOperation: true
  providers:
    - id: ftn-primary
      kind: ftn
      role: authoritative
      scope: global
      sharedZone: familytimenet.com
    - id: powerdns
      kind: powerdns
      role: authoritative
      scope: local
      sharedZone: familytimenet.com
    - id: technitium
      kind: technitium
      role: authoritative
      scope: local
      sharedZone: familytimenet.com
    - id: coredns
      kind: coredns
      role: authoritative
      scope: local
      sharedZone: familytimenet.com
    - id: hickory-dns
      kind: hickory
      role: authoritative
      scope: local
      sharedZone: familytimenet.com
    - id: unbound
      kind: unbound
      role: recursive
      scope: local
      sharedZone: familytimenet.com
    - id: dnsdist
      kind: dnsdist
      role: edge-dispatch
      scope: global
      sharedZone: familytimenet.com
  backbone:
    gobgp: enabled
    aetherCore: enabled
    globalPathOptimization: enabled
    localPathOptimization: enabled
  telemetry:
    activeProbes: true
    passiveFlow: true
    clickhouse: true
    netSA: true
  safety:
    providerCredentialsServerSide: true
    privilegedChangesRequireApproval: true
