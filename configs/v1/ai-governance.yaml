# AI Governance Policy Configuration

ai_governance:
  enabled: true
  
  # Identity and Authorization
  identity:
    provider: ftn-identity
    require_mfa: true
    session_timeout: 3600
  
  # Tool Registration and Permissions
  tools:
    - name: database_query
      requires_approval: true
      risk_level: high
      allowed_roles: [admin, dba]
    
    - name: file_access
      requires_approval: false
      risk_level: medium
      allowed_roles: [admin, developer]
    
    - name: infrastructure_modify
      requires_approval: true
      risk_level: critical
      allowed_roles: [admin]
  
  # Risk Assessment
  risk_policy:
    high_risk_threshold: 8
    critical_risk_requires_approval: true
    approval_timeout: 300
  
  # Audit and Logging
  audit:
    enabled: true
    log_all_actions: true
    retention_days: 365
    
  # Data Retention
  data_retention:
    user_data: 365
    audit_logs: 730
    temporary_files: 7