version: 1
governance:
  identity_context:
    required: true
    fields:
      - identity_id
      - session_id
      - roles
      - permissions
      - scope

  tool_registry:
    require_registered_tool: true
    deny_arbitrary_execution: true
    audit_all_actions: true

  risk:
    read:
      approval_required: false
    write:
      approval_required: false
    privileged:
      approval_required: true

  approval:
    ttl: ${AI_APPROVAL_TTL}
    requester_cannot_approve: true
    ai_cannot_approve: true
    approver_requires_permission: true
    request_binding:
      identity: true
      tool: true
      resource: true
      action: true

  execution:
    timeout: ${AI_EXECUTION_TIMEOUT}
    max_retries: ${AI_MAX_RETRIES}
    idempotency_required: true
    unknown_side_effect_policy: reconcile_before_retry
    duplicate_execution: deny

  events:
    persistence: postgresql
    replay_enabled: true
    replay_limit: ${AI_EVENT_REPLAY_LIMIT}

  adapters:
    dns:
      allowed:
        - dns.health
        - dns.zone.list
        - dns.record.list
    mail:
      allowed:
        - mail.message.read
        - mail.attachment.metadata
    network:
      allowed:
        - network.device.status
        - network.interface.status
        - network.latency
