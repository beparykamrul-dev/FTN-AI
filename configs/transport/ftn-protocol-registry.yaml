apiVersion: ftn.network/v1
kind: TransportProtocolRegistry
metadata:
  name: ftn-transport-registry
spec:
  purpose: legitimate FTN connectivity, interoperability, resilience and controlled transport selection
  scope:
    assets: ftn-owned-only
    users: authorized-ftn-identities
  protocols:
    - id: wireguard
      family: vpn
      transports: [udp]
      production: true
      role: primary
    - id: amneziawg
      family: vpn
      transports: [udp]
      production: true
      role: secondary
    - id: openvpn
      family: vpn
      transports: [tcp, udp]
      production: true
      role: secondary
    - id: hysteria2
      family: quic
      transports: [udp]
      production: true
      role: quic-secondary
    - id: shadowsocks
      family: proxy
      transports: [tcp, udp]
      production: true
      role: application-transport
    - id: xray
      family: transport-framework
      transports: [tcp, udp, quic]
      production: true
      role: application-transport
    - id: gre
      family: tunnel
      transports: [ip]
      production: true
      role: site-to-site
    - id: sslh
      family: multiplexer
      transports: [tcp]
      production: true
      role: multiplexer
    - id: websocket
      family: application-transport
      transports: [tcp]
      production: true
    - id: grpc
      family: application-transport
      transports: [tcp]
      production: true
    - id: quic
      family: transport
      transports: [udp]
      production: true
    - id: tls
      family: security
      transports: [tcp]
      production: true
    - id: webrtc
      family: realtime-media
      transports: [udp, tcp]
      production: true
      role: realtime-sfu
    - id: livekit-sfu
      family: realtime-media
      transports: [webrtc, websocket, http1, udp]
      production: true
      role: primary-sfu-adapter
    - id: turn
      family: realtime-media
      transports: [udp, tcp, tls]
      production: true
      role: nat-traversal-relay
    - id: mediasoup
      family: realtime-media
      transports: [webrtc, udp, tcp]
      production: true
      role: secondary-sfu-adapter
    - id: dot
      family: dns
      transports: [tcp]
      port: 853
      production: true
    - id: doh
      family: dns
      transports: [tcp]
      port: 443
      production: true
    - id: doq
      family: dns
      transports: [udp]
      port: 853
      production: true
    - id: ssh
      family: management
      transports: [tcp]
      production: true
      role: authorized-management
    - id: ssh-reverse
      family: management
      transports: [tcp]
      production: true
      role: authorized-reverse-management
    - id: frp
      family: reverse-tunnel
      transports: [tcp, udp]
      production: true
      role: authorized-service-ingress
    - id: rtunnel
      family: reverse-tunnel
      transports: [tcp]
      production: true
      role: authorized-service-ingress
    - id: cloudflare-tunnel
      family: external-ingress
      transports: [https]
      production: true
      role: provider-adapter
      ownership: external-provider
    - id: ngrok
      family: external-ingress
      transports: [https]
      production: true
      role: provider-adapter
      ownership: external-provider
    - id: aether-core
      family: ftn-transport-abstraction
      transports: [provider-selected]
      production: true
      role: path-orchestration
    - id: split-tunneling
      family: routing-policy
      transports: [policy]
      production: true
      role: include-exclude-routing
    - id: sandbox
      family: execution-isolation
      transports: [local]
      production: true
      role: policy-runtime-isolation
    - id: pptp
      family: legacy-vpn
      transports: [tcp]
      production: false
      status: legacy-only
  compatibility_only:
    - id: ssr
      family: legacy-proxy
      enabled: false
      status: restricted-compatibility
      note: no bypass-oriented deployment or configuration
    - id: obfs-local
      family: traffic-obfuscation
      enabled: false
      status: restricted-compatibility
      note: no restriction-bypass deployment or configuration
  policy:
    default_action: deny-unregistered
    protocol_allowlist_required: true
    health_check_before_selection: true
    failover: automatic-for-non-destructive-connectivity
    qos_and_rate_limits: policy-controlled
    audit_selection: true
    credentials: secret-store-only
    provider_adapters: explicit-allowlist-only
    external_ingress: approval-required
    management_tunnels: approval-required
    split_tunnel_changes: approval-required
  safety:
    external_restriction_bypass: prohibited
    unauthorized_access: prohibited
    credential_theft: prohibited
    traffic_retaliation: prohibited
    untrusted_provider_auto_activation: prohibited
