apiVersion: ftn.network/v1
kind: MultiTunnelTransportPolicy
metadata:
  name: ftn-multi-tunnel
spec:
  purpose: resilient multi-path connectivity across authorized FTN infrastructure
  scope:
    assets: ftn-owned-only
    identities: authorized-ftn-identities
  paths:
    - protocol: wireguard
      transports: [udp]
      role: primary
    - protocol: amneziawg
      transports: [udp]
      role: secondary
    - protocol: openvpn
      transports: [tcp, udp]
      role: secondary
    - protocol: hysteria2
      transports: [udp]
      role: quic-secondary
    - protocol: shadowsocks
      transports: [tcp, udp]
      role: application-transport
    - protocol: xray
      transports: [tcp, udp, quic]
      role: application-transport
    - protocol: gre
      transports: [ip]
      role: site-to-site
    - protocol: sslh
      transports: [tcp]
      role: multiplexer
    - protocol: websocket
      transports: [tcp]
      role: application-transport
    - protocol: grpc
      transports: [tcp]
      role: application-transport
    - protocol: quic
      transports: [udp]
      role: transport
    - protocol: tls
      transports: [tcp]
      role: security
    - protocol: dot
      transports: [tcp]
      role: dns
    - protocol: doh
      transports: [tcp]
      role: dns
    - protocol: doq
      transports: [udp]
      role: dns
    - protocol: ssh
      transports: [tcp]
      role: authorized-management
    - protocol: ssh-reverse
      transports: [tcp]
      role: authorized-reverse-management
    - protocol: frp
      transports: [tcp, udp]
      role: authorized-service-ingress
    - protocol: rtunnel
      transports: [tcp]
      role: authorized-service-ingress
    - protocol: cloudflare-tunnel
      transports: [https]
      role: provider-ingress
    - protocol: ngrok
      transports: [https]
      role: provider-ingress
    - protocol: aether-core
      transports: [provider-selected]
      role: path-orchestration
  routing_policy:
    split_tunnel:
      enabled: true
      selectors: [cidr, destination, service, vlan, subscriber]
      modes: [include, exclude]
      change_control: approval-required
  selection:
    max_active_paths: 4
    health_required: true
    latency_weighted: true
    automatic_failover: true
    deterministic_order: true
    security_downgrade: prohibited
  telemetry:
    enabled: true
    flow_metadata: true
    silk_primary: true
    raw_payload_capture: false
  safety:
    ownership_verification: required
    credentials: secret-store-only
    route_or_firewall_change: approval-required
    external_provider_activation: approval-required
    external_restriction_bypass: prohibited
    unauthorized_access: prohibited
    retaliation: prohibited
